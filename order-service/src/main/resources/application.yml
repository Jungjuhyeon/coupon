server:
  port: 8084

spring:
  application:
    name: orderserver
  datasource:
    url: jdbc:mysql://order-mysql:3306/order?rewriteBatchedStatements=true
    username: root
    password: password123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 55

  data:
    mongodb:
      auto-index-creation: true
      host: order-mongodb
      port: 27017
      database: orders
    redis:
      cluster:
        nodes:
          - redis-node-1:6379
          - redis-node-2:6379
          - redis-node-3:6379
          - redis-node-4:6379
          - redis-node-5:6379
          - redis-node-6:6379

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 200
    open-in-view: false

  kafka:
    bootstrap-servers: kafka-server:9092
    consumer:
      properties:
        spring.json.trusted.packages: "*"
kafka:
  producers:
    topic1:
      name: coupon_issue
    topic2:
      name: coupon_log
    topic3:
      name: orders_created

  consumer:
    topic1:
      name: coupon_issue
      groupid: issue
    topic2:
      name: coupon_log
      groupid: log
    topic3:
      name: orders_created
      groupid1: created
      groupid2: created-log

jwt:
  secret:
    key: 605dce51-77ff-44a4-8977-423ec21b9e0c


logging.level:
  org:
  hibernate.SQL: debug
  springFramework:
    transaction:
      interceptor : TRACE

