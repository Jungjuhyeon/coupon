
services:
  # MySQL 서비스
  my-mysql:
    image: mysql:latest
    container_name: my-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - /Users/jeongjuhyeon/개발/docker-mysql/mysql_data:/var/lib/mysql
    networks:
      - coupon-network
    restart: always
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      retries: 5
      start_period: 30s
      timeout: 10s

  mysqld-exporter:
    container_name: mysqld_exporter
    image: prom/mysqld-exporter
    environment:
      - DATA_SOURCE_NAME="wngus:password123@(my-mysql:3306)/"
    command:
      - "--mysqld.username=wngus:password123"
      - "--mysqld.address=my-mysql:3306"
    ports:
      - "9104:9104"
    depends_on:
      - my-mysql
    restart: unless-stopped
    networks:
      - coupon-network  # 추가된 부분

  # Redis (Cache Server) 서비스
  cache-server:
    image: redis
    container_name: cache-server
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 10
    networks:
      - coupon-network

  zookeeper-1:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - '32181:32181'
    environment:
      ZOOKEEPER_CLIENT_PORT: 32181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-1:
    image: confluentinc/cp-kafka:7.4.3
    container_name: kafka
    ports:
      - '9092:9092'
    depends_on:
      - zookeeper-1
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:32181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 4

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8989:8080"
    restart: always
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:29092
      - KAFKA_CLUSTERS_0

  # Spring Boot 애플리케이션 서비스 (my-server)
  my-server:
    build: .
    container_name: my-server
    cpus: 2.0  # CPU 리소스 2개의 vCPU 할당
    mem_limit: 2g  # 메모리 2GB로 설정
    ports:
      - "8080:8080"
    depends_on:
      - my-mysql
      - cache-server
    networks:
      - coupon-network
    privileged: true  # 호스트 자원 접근 허용
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/test" ]  # /test 엔드포인트로 건강 체크
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s

  # Prometheus 서비스
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--enable-feature=native-histograms'
      - '--web.enable-remote-write-receiver'
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - coupon-network

  # Grafana 서비스
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - coupon-network

  # K6 부하 테스트 서비스
  k6:
    image: grafana/k6
    container_name: k6
    volumes:
      - ./k6-scripts:/scripts
#    command: sleep infinity  # sleep 명령어로 컨테이너 계속 실행
    command: run -o experimental-prometheus-rw /scripts/scripts.js
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_DASHBOARD=true  # 대시보드 활성화
      - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
#      - my-server  # my-server가 시작되기를 기다립니다.
    networks:
      - coupon-network

networks:
  coupon-network:
    driver: bridge
