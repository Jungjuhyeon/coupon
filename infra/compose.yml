
services:
  # Redis (Cache Server) 서비스
#  cache-server:
#    image: redis
#    container_name: cacheserver
#    ports:
#      - "6379:6379"
#    healthcheck:
#      test: [ "CMD", "redis-cli", "ping" ]
#      interval: 5s
#      retries: 10
#    networks:
#      - coupon-network

  zookeeper-1:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - '32181:32181'
    networks:
      - coupons-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 32181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-server:
    image: confluentinc/cp-kafka:7.4.3
    container_name: kafka-server
    ports:
      - '29092:29092'
    depends_on:
      - zookeeper-1
    networks:
      - coupons-network
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:32181
#      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
#      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-server:9092,EXTERNAL://localhost:29092
#      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-server:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 4


  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8989:8080"
    restart: always
    networks:
      - coupons-network
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-server:9092
      - KAFKA_CLUSTERS_0

  redis-node-1:
    image: redis
    container_name: redis-node-1
    command: redis-server /redis-node-1.conf
    volumes:
      - ./redis-node-1.conf:/redis-node-1.conf
    ports:
      - "7001:6379"
      - "17001:16379"
    networks:
      - coupons-network

  redis-node-2:
    image: redis
    container_name: redis-node-2
    command: redis-server /redis-node-2.conf
    volumes:
      - ./redis-node-2.conf:/redis-node-2.conf
    ports:
      - "7002:6379"
      - "17002:16379"
    networks:
      - coupons-network

  redis-node-3:
    image: redis
    container_name: redis-node-3
    command: redis-server /redis-node-3.conf
    volumes:
      - ./redis-node-3.conf:/redis-node-3.conf
    ports:
      - "7003:6379"
      - "17003:16379"
    networks:
      - coupons-network

  redis-node-4:
    image: redis
    container_name: redis-node-4
    command: redis-server /redis-node-4.conf
    volumes:
      - ./redis-node-4.conf:/redis-node-4.conf
    ports:
      - "7004:6379"
      - "17004:16379"
    networks:
      - coupons-network

  redis-node-5:
    image: redis
    container_name: redis-node-5
    command: redis-server /redis-node-5.conf
    volumes:
      - ./redis-node-5.conf:/redis-node-5.conf
    ports:
      - "7005:6379"
      - "17005:16379"
    networks:
      - coupons-network

  redis-node-6:
