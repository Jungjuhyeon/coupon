
services:
  store-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8082:8082
    networks:
      - coupons-network
  # MySQL 서비스
  store-mysql:
    image: mysql:latest
    container_name: store-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password123
    ports:
      - "3308:3306"
    volumes:
      - /Users/jeongjuhyeon/개발/docker-mysql/mysql_data_store:/var/lib/mysql
    networks:
      - coupons-network
    restart: always
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      retries: 5
      start_period: 30s
      timeout: 10s

